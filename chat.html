<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Messages — HMC Portal</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/theme.css">
  <script type="module">import { initTheme } from './js/theme.js'; initTheme();</script>
</head>
<body>
<div id="toast-container"></div>

<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main-content" style="padding:0;overflow:hidden">
    <div class="chat-layout" style="height:100vh">

      <!-- Chat Sidebar (rooms) -->
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <div class="chat-sidebar-title">Messages</div>
          <div class="search-bar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Search…" id="room-search">
          </div>
        </div>
        <div class="chat-rooms-list" id="rooms-list">
          <div class="empty-state" style="padding:var(--sp-8)">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="chat-main">
        <div class="chat-header" id="chat-header">
          <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-glass);display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="chat-header-info">
            <div class="chat-header-name">Select a chat room</div>
            <div class="chat-header-desc">Choose a room from the left panel</div>
          </div>
        </div>

        <div class="messages-container" id="messages-area">
          <div class="empty-state" style="flex:1">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <h3>No messages yet</h3>
            <p style="font-size:0.85rem">Select a room to start chatting</p>
          </div>
        </div>

        <!-- Tag autocomplete -->
        <div style="position:relative;padding:0 var(--sp-6)">
          <div class="tag-autocomplete hidden" id="tag-autocomplete"></div>
        </div>

        <!-- Input -->
        <div class="message-input-area" id="message-input-area" style="display:none">
          <div class="message-input-wrapper">
            <textarea
              class="message-input"
              id="message-input"
              placeholder="Type a message… Use @Role or #Name / #ID to tag"
              rows="1"
              onkeydown="handleMsgKeydown(event)"
              oninput="handleInputChange(this)"
            ></textarea>
            <button class="message-send-btn" id="send-btn" onclick="sendMsg()" title="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div style="font-size:0.72rem;color:var(--text-muted);margin-top:6px;padding:0 4px">
            <strong style="color:var(--brand-secondary)">@Role</strong> to tag by role · <strong style="color:var(--brand-primary)">#Name or #ID</strong> to tag member · Enter to send
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { initAuthGuard, populateSidebarUser } from './js/auth.js';
  import { renderSidebar, initSidebarTheme } from './js/sidebar.js';
  import { getChatRooms, listenToMessages, sendMessage, getMembersForTagging, parseTags, clearUnreadMessages } from './js/chat.js';
  import { renderAvatar, avatarPlaceholder, formatTime, timeAgo, parseMessageTags, showToast } from './js/utils.js';

  document.getElementById('sidebar-container').innerHTML = renderSidebar('chat.html');
  initSidebarTheme();

  let currentUser    = null;
  let currentRoomId  = null;
  let msgUnsubscribe = null;
  let allMembers     = [];
  let rooms          = [];
  let lastDate       = null;

  initAuthGuard({
    requireLogin: true,
    onReady: async (user) => {
      currentUser = user;
      populateSidebarUser(user);

      // Clear unread messages count on open
      clearUnreadMessages(user.uid);

      // Load members for tagging
      allMembers = await getMembersForTagging();

      // Load rooms
      rooms = await getChatRooms(user);
      renderRooms(rooms);

      // Auto-open global room
      if (rooms.length) openRoom(rooms[0]);
    }
  });

  function renderRooms(list) {
    const el = document.getElementById('rooms-list');
    const svgGlobal = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    const svgInbox  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand-secondary)" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`;
    el.innerHTML = list.map(room => `
      <div class="chat-room-item ${currentRoomId === room.id ? 'active' : ''}" id="room-${room.id}" onclick="openRoom(${JSON.stringify(room).replace(/"/g, '&quot;')})">
        <div class="chat-room-icon">${room.type === 'inbox' ? svgInbox : svgGlobal}</div>
        <div class="chat-room-info">
          <div class="chat-room-name">${room.name}</div>
          <div class="chat-room-last-msg" id="last-msg-${room.id}">${room.type === 'inbox' ? 'Your tagged messages & mentions' : (room.lastMessage || 'No messages yet')}</div>
        </div>
      </div>
    `).join('');
  }

  window.openRoom = function(room) {
    currentRoomId = room.id;
    lastDate = null;

    const svgGlobal = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
    const svgInbox  = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand-secondary)" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`;
    const isInbox = room.type === 'inbox';

    // Update header
    document.getElementById('chat-header').innerHTML = `
      <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-glass);display:flex;align-items:center;justify-content:center">${isInbox ? svgInbox : svgGlobal}</div>
      <div class="chat-header-info">
        <div class="chat-header-name">${room.name}</div>
        <div class="chat-header-desc">${isInbox ? 'Messages where you are @tagged or #mentioned' : room.type === 'global' ? 'All HMC Members — general broadcasts' : 'Team Channel'}</div>
      </div>
    `;

    document.getElementById('message-input-area').style.display = 'block';

    // Highlight selected room
    document.querySelectorAll('.chat-room-item').forEach(r => r.classList.remove('active'));
    const roomEl = document.getElementById(`room-${room.id}`);
    if (roomEl) roomEl.classList.add('active');

    // Unsubscribe previous listener
    if (msgUnsubscribe) msgUnsubscribe();

    // Listen to messages
    msgUnsubscribe = listenToMessages(room.id, currentUser, (messages) => {
      renderMessages(messages);
    });
  };

  function renderMessages(messages) {
    const area = document.getElementById('messages-area');
    if (!messages.length) {
      area.innerHTML = `<div class="empty-state" style="flex:1">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p style="font-size:0.9rem">Be the first to send a message!</p>
      </div>`;
      return;
    }

    let html = '';
    let prevDate = null;

    messages.forEach(msg => {
      const isOwn = msg.senderUid === currentUser.uid;
      const d = msg.timestamp?.toDate ? msg.timestamp.toDate() : new Date(msg.timestamp || Date.now());
      const dateStr = d.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long' });

      if (dateStr !== prevDate) {
        html += `<div class="date-divider"><span>${dateStr}</span></div>`;
        prevDate = dateStr;
      }

      const initials = (msg.senderName || 'U').split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
      const avatarHtml = msg.senderPicUrl
        ? `<img src="${msg.senderPicUrl}" class="message-avatar">`
        : `<div class="avatar-placeholder avatar-sm" style="width:32px;height:32px;font-size:11px;flex-shrink:0">${initials}</div>`;

      const contentHtml = parseMessageTags(escapeHtml(msg.content));

      html += `
        <div class="message ${isOwn ? 'own' : 'other'}">
          ${!isOwn ? avatarHtml : ''}
          <div class="message-bubble-wrap">
            ${!isOwn ? `<div class="message-sender-name">${msg.senderName} · <span style="font-size:0.68rem;font-family:var(--font-mono)">${msg.senderUniqueId || ''}</span></div>` : ''}
            <div class="message-bubble">${contentHtml}</div>
            <div class="message-time">${formatTime(msg.timestamp)}</div>
          </div>
          ${isOwn ? avatarHtml : ''}
        </div>
      `;
    });

    area.innerHTML = html;
    area.scrollTop = area.scrollHeight;
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.handleMsgKeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  };

  window.handleInputChange = function(el) {
    // Auto-resize
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';

    // Tag autocomplete
    const text = el.value;
    const cursor = el.selectionStart;
    const before = text.slice(0, cursor);
    const atMatch = before.match(/@(\w*)$/);
    const hashMatch = before.match(/#([A-Za-z0-9_]*)$/);

    if (atMatch) {
      showTagAutocomplete(atMatch[1], 'post');
    } else if (hashMatch) {
      showTagAutocomplete(hashMatch[1], 'id');
    } else {
      hideTagAutocomplete();
    }
  };

  function showTagAutocomplete(query, type) {
    let items = [];

    if (type === 'post') {
      const q = query.toLowerCase();
      const categories = ['Mess', 'Hostel', 'Events', 'Sports', 'Cleanliness', 'Water TDS', 'Electricity', 'Laundry', 'Food Testing', 'HMC', 'Security'];

      // 1. Add Category Group tags (e.g. @Mess, @Hostel)
      categories.forEach(cat => {
        if (cat.toLowerCase().includes(q) || !q) {
          items.push({
            tag: cat,
            label: `@${cat}`,
            sub: `Notify all ${cat} committee members`,
            type: 'category'
          });
        }
      });

      // 2. Add Category Head tags (e.g. @Mess Head, @Hostel Head)
      categories.forEach(cat => {
        const headTag = `${cat} Head`;
        if (headTag.toLowerCase().includes(q) || !q) {
          items.push({
            tag: headTag,
            label: `@${headTag}`,
            sub: `Tag ${cat} Head`,
            type: 'head'
          });
        }
      });

      // 3. Add Member names / posts
      const seen = new Set();
      allMembers.forEach(m => {
        const postLabel = m.post || 'Member';
        const fullLabel = m.category ? `${m.category} ${postLabel}` : postLabel;
        if (m.name?.toLowerCase().includes(q) || postLabel.toLowerCase().includes(q) || fullLabel.toLowerCase().includes(q)) {
          if (!seen.has(m.uid)) {
            seen.add(m.uid);
            items.push({
              tag: m.name || fullLabel,
              label: `@${m.name}`,
              sub: `${fullLabel} · ${m.uniqueId || ''}`,
              pic: m.profilePicUrl,
              type: 'member'
            });
          }
        }
      });

      items = items.slice(0, 7);
    } else {
      const q = query.toLowerCase();
      items = allMembers
        .filter(m => (m.uniqueId?.toLowerCase().includes(q) || m.name?.toLowerCase().includes(q)))
        .slice(0, 6)
        .map(m => ({
          tag: m.name ? m.name.replace(/\s+/g, '') : (m.uniqueId || ''),
          label: `#${m.name || m.uniqueId}`,
          sub: `${m.title || m.post || 'Member'} · ${m.uniqueId || ''}`,
          pic: m.profilePicUrl,
          type: 'member'
        }));
    }

    const el = document.getElementById('tag-autocomplete');
    if (!items.length) { el.classList.add('hidden'); return; }

    el.classList.remove('hidden');
    el.innerHTML = items.map(item => `
      <div class="tag-autocomplete-item" onclick="insertTag('${item.tag.replace(/'/g, "\\'")}', '${type}')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer">
        ${item.pic
          ? `<img src="${item.pic}" class="avatar avatar-sm">`
          : `<div class="avatar-placeholder avatar-sm" style="width:26px;height:26px;font-size:10px;border-radius:50%;background:rgba(108,99,255,0.2);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700">${item.type==='category'?'@':(item.label[1]||'U').toUpperCase()}</div>`}
        <div style="flex:1">
          <div style="font-weight:700;font-size:0.85rem;color:var(--text-primary)">${item.label}</div>
          <div style="font-size:0.7rem;color:var(--text-muted)">${item.sub}</div>
        </div>
        <span style="font-size:0.65rem;font-weight:800;padding:2px 6px;border-radius:4px;background:rgba(108,99,255,0.15);color:var(--brand-secondary);text-transform:uppercase">${item.type}</span>
      </div>
    `).join('');
  }

  function hideTagAutocomplete() {
    document.getElementById('tag-autocomplete').classList.add('hidden');
  }

  window.insertTag = function(tag, type) {
    const input = document.getElementById('message-input');
    const text = input.value;
    const cursor = input.selectionStart;
    const prefix = type === 'post' ? '@' : '#';
    const pattern = type === 'post' ? /@(\w*)$/ : /#(HMC_\d{0,2}_?\d{0,3})$/;
    const before = text.slice(0, cursor);
    const newBefore = before.replace(pattern, `${prefix}${tag} `);
    input.value = newBefore + text.slice(cursor);
    input.focus();
    hideTagAutocomplete();
  };

  window.sendMsg = async function() {
    if (!currentRoomId) return;
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';
    input.style.height = 'auto';
    hideTagAutocomplete();

    try {
      await sendMessage(currentRoomId, {
        senderUid:      currentUser.uid,
        senderName:     currentUser.name,
        senderUniqueId: currentUser.uniqueId,
        senderPicUrl:   currentUser.profilePicUrl,
        content
      });
    } catch (e) {
      showToast(e.message || 'Failed to send message', 'error');
    }
  };
</script>
</body>
</html>

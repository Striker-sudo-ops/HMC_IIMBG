<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Committee Editor — Admin HMC Portal</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script type="module">import { initTheme } from '../js/theme.js'; initTheme();</script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout">
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Committee Editor</h1>
        <p class="page-subtitle">Add, edit or remove public-facing HMC committee members</p>
      </div>
      <button class="btn btn-primary" onclick="openModal('add-comm-modal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Member
      </button>
    </div>

    <div class="page-body">
      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:var(--sp-5)">
        <button class="tab active" onclick="showTab('current',this)">Current Members</button>
        <button class="tab" onclick="showTab('past',this)">Past Members</button>
      </div>

      <div id="tab-current">
        <div id="current-editor-grid" class="comm-editor-grid">
          <div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div>
        </div>
      </div>

      <div id="tab-past" class="hidden">
        <div id="past-editor-grid" class="comm-editor-grid">
          <div class="empty-state"><p>No past members yet</p></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="add-comm-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title" id="comm-modal-title">Add Committee Member</h3>
      <button class="modal-close" onclick="closeCommModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="comm-form" onsubmit="handleSaveComm(event)">
      <!-- Profile Picture -->
      <div style="text-align:center;margin-bottom:var(--sp-4)">
        <div style="position:relative;display:inline-block">
          <div id="comm-avatar-preview" style="width:80px;height:80px;border-radius:50%;background:var(--bg-glass);border:2px dashed var(--border-normal);display:flex;align-items:center;justify-content:center;color:var(--text-muted);margin:0 auto">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <label style="position:absolute;bottom:0;right:0;background:var(--brand-primary);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bg-surface)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <input type="file" id="comm-pic-input" accept="image/*" style="display:none" onchange="previewCommPic(this)">
          </label>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="c-name" class="form-control" required placeholder="e.g. Arjun Mehta">
        </div>
        <div class="form-group">
          <label class="form-label">Designation *</label>
          <input type="text" id="c-desg" class="form-control" required placeholder="e.g. General Secretary">
        </div>
        <div class="form-group">
          <label class="form-label">Contact Number</label>
          <input type="tel" id="c-contact" class="form-control" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">Official Email</label>
          <input type="email" id="c-email" class="form-control" placeholder="name@iimbg.ac.in">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label class="form-label">Associated Faculty Advisor / Professor</label>
          <input type="text" id="c-prof" class="form-control" placeholder="Prof. Name (Department)">
        </div>
        <div class="form-group">
          <label class="form-label">Batch (e.g. 2024–26)</label>
          <input type="text" id="c-batch" class="form-control" placeholder="2024–26">
        </div>
        <div class="form-group">
          <label class="form-label">Display Order</label>
          <input type="number" id="c-order" class="form-control" value="10" min="1" max="99">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:var(--sp-3)">
          <input type="checkbox" id="c-current" checked style="width:18px;height:18px;accent-color:var(--brand-primary)">
          <label for="c-current" class="form-label" style="margin:0;cursor:pointer">Current Member</label>
        </div>
      </div>

      <div class="flex gap-3" style="margin-top:var(--sp-5)">
        <button type="submit" class="btn btn-primary flex-1" id="comm-save-btn">Add Member</button>
        <button type="button" class="btn btn-secondary" onclick="closeCommModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<style>
  .comm-editor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--sp-4); }
  .comm-ed-card {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg); backdrop-filter: var(--glass-blur);
    padding: var(--sp-4); position: relative;
    transition: var(--transition-fast);
  }
  .comm-ed-card:hover { border-color: var(--border-normal); }
  .comm-ed-card-actions { display:flex; gap:var(--sp-2); margin-top:var(--sp-3); }
  .comm-ed-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; border: 2px solid var(--border-normal);
    flex-shrink: 0;
  }
  .comm-ed-avatar-ph {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--grad-primary); display: flex; align-items: center;
    justify-content: center; font-size: 20px; font-weight: 800; color: white;
    flex-shrink: 0;
  }
</style>

<script type="module">
  import { initAuthGuard, populateSidebarUser } from '../js/auth.js';
  import { renderSidebar, initSidebarTheme } from '../js/sidebar.js';
  import {
    getCommitteeMembers, addCommitteeMember,
    updateCommitteeMember, removeCommitteeMember
  } from '../js/committee.js';
  import { uploadFile } from '../js/utils.js';
  import { showToast, openModal, closeModal } from '../js/utils.js';

  document.getElementById('sidebar-container').innerHTML = renderSidebar('committee-editor.html');
  initSidebarTheme();

  window.openModal  = openModal;
  window.closeModal = closeModal;

  let allMembers = [];
  let editingId  = null;
  let picFile    = null;

  initAuthGuard({
    requireLogin: true,
    requireRoles: ['admin'],
    onReady: async (user) => {
      populateSidebarUser(user);
      await loadMembers();
    }
  });

  async function loadMembers() {
    allMembers = await getCommitteeMembers();
    renderGrid(allMembers.filter(m => m.isCurrent),  'current-editor-grid');
    renderGrid(allMembers.filter(m => !m.isCurrent), 'past-editor-grid');
  }

  function renderGrid(members, gridId) {
    const el = document.getElementById(gridId);
    if (!members.length) {
      el.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>None yet</p></div>';
      return;
    }
    el.innerHTML = members.sort((a,b) => (a.order||999)-(b.order||999)).map(m => {
      const init = (m.name||'M').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
      const avatarHtml = m.profilePicUrl
        ? `<img src="${m.profilePicUrl}" class="comm-ed-avatar" alt="${m.name}">`
        : `<div class="comm-ed-avatar-ph">${init}</div>`;
      return `
        <div class="comm-ed-card">
          <div style="display:flex;gap:var(--sp-3);align-items:center">
            ${avatarHtml}
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.name}</div>
              <div style="font-size:0.78rem;color:var(--brand-primary)">${m.designation}</div>
              ${m.contactNumber ? `<div style="font-size:0.73rem;color:var(--text-muted)">${m.contactNumber}</div>` : ''}
            </div>
          </div>
          ${m.associatedProfessor ? `<div style="margin-top:var(--sp-2);font-size:0.73rem;color:var(--text-muted);border-top:1px solid var(--border-subtle);padding-top:var(--sp-2)">Advisor: ${m.associatedProfessor}</div>` : ''}
          <div class="comm-ed-card-actions">
            <button class="btn btn-sm btn-secondary flex-1" onclick="openEdit('${m.id}')">Edit</button>
            <button class="btn btn-sm btn-secondary flex-1" onclick="handleToggleCurrent('${m.id}','${m.isCurrent}')">
              ${m.isCurrent ? 'Mark Past' : 'Mark Current'}
            </button>
            <button class="btn btn-icon btn-sm" onclick="handleRemove('${m.id}','${m.name}')" title="Delete" style="color:var(--brand-danger)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.showTab = function(tab, btn) {
    document.getElementById('tab-current').classList.toggle('hidden', tab !== 'current');
    document.getElementById('tab-past').classList.toggle('hidden', tab !== 'past');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
  };

  window.previewCommPic = function(input) {
    if (!input.files[0]) return;
    picFile = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('comm-avatar-preview').innerHTML =
        `<img src="${e.target.result}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`;
    };
    reader.readAsDataURL(picFile);
  };

  window.closeCommModal = function() {
    closeModal('add-comm-modal');
    document.getElementById('comm-form').reset();
    document.getElementById('comm-avatar-preview').innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    picFile = null;
    editingId = null;
  };

  window.openEdit = function(id) {
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    editingId = id;
    document.getElementById('comm-modal-title').textContent = 'Edit Committee Member';
    document.getElementById('c-name').value    = m.name || '';
    document.getElementById('c-desg').value    = m.designation || '';
    document.getElementById('c-contact').value = m.contactNumber || '';
    document.getElementById('c-email').value   = m.email || '';
    document.getElementById('c-prof').value    = m.associatedProfessor || '';
    document.getElementById('c-batch').value   = m.batch || '';
    document.getElementById('c-order').value   = m.order || 10;
    document.getElementById('c-current').checked = !!m.isCurrent;
    document.getElementById('comm-save-btn').textContent = 'Update Member';
    if (m.profilePicUrl) {
      document.getElementById('comm-avatar-preview').innerHTML =
        `<img src="${m.profilePicUrl}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`;
    }
    openModal('add-comm-modal');
  };

  window.handleSaveComm = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('comm-save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      let profilePicUrl = allMembers.find(m => m.id === editingId)?.profilePicUrl || null;
      if (picFile) {
        const { compressImageToBase64 } = await import('../js/members.js');
        profilePicUrl = await compressImageToBase64(picFile);
      }

      const data = {
        name:                document.getElementById('c-name').value.trim(),
        designation:         document.getElementById('c-desg').value.trim(),
        contactNumber:       document.getElementById('c-contact').value.trim(),
        email:               document.getElementById('c-email').value.trim(),
        associatedProfessor: document.getElementById('c-prof').value.trim(),
        batch:               document.getElementById('c-batch').value.trim(),
        order:               parseInt(document.getElementById('c-order').value) || 10,
        isCurrent:           document.getElementById('c-current').checked,
        profilePicUrl
      };

      if (editingId) {
        await updateCommitteeMember(editingId, data);
        showToast('Member updated!', 'success');
      } else {
        await addCommitteeMember(data);
        showToast('Member added!', 'success');
      }

      closeCommModal();
      await loadMembers();
    } catch (err) {
      showToast(err.message || 'Save failed', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = editingId ? 'Update Member' : 'Add Member';
    }
  };

  window.handleToggleCurrent = async function(id, isCurrent) {
    try {
      const { setMemberCurrentStatus } = await import('../js/committee.js');
      await setMemberCurrentStatus(id, !JSON.parse(isCurrent));
      showToast('Status updated!', 'success');
      await loadMembers();
    } catch (e) { showToast(e.message, 'error'); }
  };

  window.handleRemove = async function(id, name) {
    if (!confirm(`Remove ${name} from the committee?`)) return;
    try {
      await removeCommitteeMember(id);
      showToast(`${name} removed`, 'info');
      await loadMembers();
    } catch (e) { showToast(e.message, 'error'); }
  };
</script>
</body>
</html>
